<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Markdown Editor & Live Preview</title>
    <meta name="description" content="Write Markdown and see live HTML preview instantly. Free online markdown editor with real-time rendering.">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
        body{background:#0f1026;color:#fff;line-height:1.6}
        header{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
        header h1{font-size:18px;font-weight:600;letter-spacing:.4px}
        header p{font-size:13px;opacity:.6;margin-top:4px}
        main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.08);height:calc(100vh - 78px)}
        .panel{background:#0f1026;display:flex;flex-direction:column}
        .panel-header{padding:10px 16px;font-size:12px;text-transform:uppercase;letter-spacing:4px;opacity:.5;border-bottom:1px solid rgba(255,255,255,.08)}
        textarea{flex:1;background:transparent;border:none;color:#fff;padding:20px;font-size:15px;line-height:1.9;resize:none;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
        #preview{flex:1;overflow:auto;padding:30px 40px}
        #preview h1,#preview h2,#preview h3{margin:24px 0 12px}
        #preview p{margin:12px 0;opacity:.9}
        #preview pre{background:rgba(255,255,255,.05);padding:16px;border-radius:10px;overflow:auto;margin:16px 0}
        #preview code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
        #preview ul,#preview ol{padding-left:26px;margin:14px 0}
        #preview a{color:#7aa2f7;text-decoration:none}
        #preview blockquote{border-left:2px solid rgba(122,162,247,.8);padding-left:18px;opacity:.8;margin:18px 0}
        footer{position:fixed;bottom:8px;width:100%;text-align:center;font-size:11px;opacity:.4}
        @media(max-width:1080px){main{grid-template-columns:1fr;grid-auto-rows:1fr}}
    </style>
</head>
<body>
    <header>
        <h1>Free Online Markdown Editor & Live Preview</h1>
        <p>Write Markdown. See rendered HTML in real-time.</p>
    </header>
    <main>
        <div class="panel">
            <div class="panel-header">Markdown</div>
            <textarea id="markdown" spellcheck="false" placeholder="# Write your markdown here..."># Markdown Editor

Type on the left, preview on the right.

- Fast
- Clean
- Free online</textarea>
        </div>
        <div class="panel">
            <div class="panel-header">Live Preview</div>
            <div id="preview"></div>
        </div>
    </main>
    <footer>Free Online Markdown Editor • GitHub Pages Ready</footer>
    <script>
        const md=document.getElementById('markdown');
        const prev=document.getElementById('preview');
        function render(){prev.innerHTML=marked.parse(md.value||'');}
        md.addEventListener('input',render);
        render();
    </script>
</body>
</html>
